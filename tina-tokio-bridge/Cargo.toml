[package]
name = "tina-tokio-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/russellromney/tina-rs"

[dependencies]
tina = { path = "../tina" }
tina-runtime = { path = "../tina-runtime" }
tokio = { version = "1.48.0", default-features = false, features = ["rt", "sync", "time"] }
# Optional tracing emission. Enables per-call events under
# `tina_tokio.bridge.call` (`admission_rejected`, `admitted`, `replied`,
# `timeout`, `dropped_response`) and lifecycle events under
# `tina_tokio.bridge` (`close`). See `docs/tina-user-guide/19-tracing.md`
# for the field/level/reason vocabulary.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tina-sim = { path = "../tina-sim" }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
