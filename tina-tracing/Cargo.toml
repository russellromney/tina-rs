[package]
name = "tina-tracing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Adapter from tina-runtime trace events and live reports to tracing events"
repository = "https://github.com/russellromney/tina-rs"

[lib]
path = "src/lib.rs"

[dependencies]
tina = { path = "../tina" }
tina-runtime = { path = "../tina-runtime" }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }

[features]
default = []
subscriber = ["dep:tracing-subscriber"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
