[package]
name = "tina-tower-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tower::Service adapter over a Tina bridge handle"
repository = "https://github.com/russellromney/tina-rs"

[lib]
path = "src/lib.rs"

[dependencies]
tina = { path = "../tina" }
tina-runtime = { path = "../tina-runtime" }
tina-tokio-bridge = { path = "../tina-tokio-bridge" }
tower-service = "0.3"
tokio = { version = "1.48.0", default-features = false, features = ["rt", "sync", "time"] }
# Optional tracing scaffolding. No spans/events are emitted yet; the
# feature surface is here so we can align vocabulary across bridges
# in one pass instead of inventing per-crate field names.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tower = { version = "0.5", default-features = false, features = ["timeout", "limit", "buffer"] }
