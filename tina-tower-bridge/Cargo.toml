[package]
name = "tina-tower-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tower::Service adapter over a Tina bridge handle"
repository = "https://github.com/russellromney/tina-rs"

[lib]
path = "src/lib.rs"

[dependencies]
tina = { path = "../tina" }
tina-runtime = { path = "../tina-runtime" }
tina-tokio-bridge = { path = "../tina-tokio-bridge" }
tower-service = "0.3"
tokio = { version = "1.48.0", default-features = false, features = ["rt", "sync", "time"] }
# Optional tracing emission. Enables tower-layer events under
# `tina_tower.bridge.call` (`tower_call`, `tower_response`,
# `tower_error`) plus a `close` lifecycle event under
# `tina_tower.bridge`. These sit *above* the underlying tokio
# bridge events; both fire for the same call. See
# `docs/tina-user-guide/19-tracing.md` for the field vocabulary.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tower = { version = "0.5", default-features = false, features = ["timeout", "limit", "buffer"] }
