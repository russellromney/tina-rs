[workspace]
members = [
    "tina",
    "tina-http",
    "tina-macros",
    "tina-mailbox-spsc",
    "tina-rpc",
    "tina-rpc-macros",
    "tina-reqwest-bridge",
    "tina-sqlite-bridge",
    "tina-rpc-tokio",
    "tina-runtime",
    "tina-sim",
    "tina-supervisor",
    "tina-tokio-bridge",
    "tina-tower-bridge",
]
exclude = [
    "examples/eiffel_real_io_chat",
    "examples/eiffel_rpc",
    "examples/eiffel_mini_keyspace",
    "examples/eiffel_axum_counter",
    "examples/eiffel_ws_room",
    "examples/eiffel_mux_client",
    "examples/eiffel_cpu_run",
    "examples/eiffel_mem_run",
    "examples/eiffel_supervised_worker",
    "examples/eiffel_persistent_counter",
    "examples/eiffel_replay_dst",
    "examples/eiffel_outbound_fetch",
    "examples/eiffel_scatter_gather",
    "examples/eiffel_outbound_http",
    "examples/eiffel_graceful_shutdown",
    "examples/eiffel_native_http",
    "examples/eiffel_sharded_keyspace",
    "examples/eiffel_webhook_publisher",
    "examples/eiffel_retrying_outbound_http",
    "examples/eiffel_rate_limited_worker",
    "examples/eiffel_sharded_fanout_read",
    "examples/eiffel_tower_timeout_counter",
    "examples/eiffel_periodic_batcher",
    "examples/eiffel_backpressure_chain",
    "examples/eiffel_graceful_drain_server",
    "examples/eiffel_sqlite_counter",
    "examples/eiffel_dynamic_worker_pool",
    "examples/eiffel_cancellation_chain",
    "examples/eiffel_owned_state_leak",
    "examples/eiffel_worker_pool",
    "examples/eiffel_bounded_batcher",
    "examples/eiffel_webhook_fanout",
    "examples/eiffel_hot_key_fairness",
    "examples/eiffel_two_stage_pipeline",
    "examples/eiffel_graceful_pool_shutdown",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
