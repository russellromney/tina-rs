[package]
name = "tina-codec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sync byte-codec helpers (line and length framing) for Tina isolates"
repository = "https://github.com/russellromney/tina-rs"
keywords = ["codec", "framing", "serialization"]
categories = ["encoding"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Compile-fail fixtures pin that the `Framer` trait stays sealed and the
# codec adapter state stays typed (not stringly).
trybuild = "1"
