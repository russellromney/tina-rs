[package]
name = "tina-aws-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded AWS SDK workers (S3, SQS, DynamoDB, SNS, Secrets Manager) for Tina services"
repository = "https://github.com/russellromney/tina-rs"
keywords = ["aws", "s3", "sqs"]
categories = ["asynchronous", "network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
tina = { path = "../tina", version = "0.1.0" }
tina-runtime = { path = "../tina-runtime", version = "0.1.0" }
aws-sdk-s3 = "1.96"
aws-sdk-sqs = "1.85"
aws-sdk-dynamodb = "1.96"
aws-sdk-sns = "1.85"
aws-sdk-secretsmanager = "1.85"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
