[package]
name = "tina-proof-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Small proof harnesses for Tina specimens: load/soak, bad-peer, live trace capture."
repository = "https://github.com/russellromney/tina-rs"
keywords = ["testing", "load-test", "simulation"]
categories = ["development-tools::testing"]

[lib]
path = "src/lib.rs"

[dependencies]
socket2 = "0.6"
tina = { path = "../tina", version = "0.1.0" }
tina-runtime = { path = "../tina-runtime", version = "0.1.0" }
tina-sim = { path = "../tina-sim", version = "0.1.0" }
