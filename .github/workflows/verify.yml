name: verify

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly fuzz run (see the `fuzz` job) and a manual trigger. Per-PR fuzzing
  # is too slow to gate on; the seed corpus is folded into deterministic unit
  # tests (`tina-http` `fuzz_corpus_regression` + `http2` lib tests) so every
  # PR still exercises the panic-containment property.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  verify:
    name: make verify (${{ matrix.os }})
    # Per-PR / push gate only; the scheduled trigger runs the fuzz job instead.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install pinned Rust toolchain
        # rustup show syncs the toolchain + components pinned in
        # rust-toolchain.toml, so the pin is the single source of truth.
        run: rustup show

      - name: Betelgeuse Linux backend smoke
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p tina-runtime --test betelgeuse_backend_ci
          cargo test --locked -p tina-runtime --test tcp_echo threaded_runtime_tcp_echo_round_trips_reference_workload

      - name: Bridge feature checks
        run: cargo check -p tina-sqlx-bridge --features tracing

      - name: Fuzz shim compiles
        # The `fuzzing` feature exposes decoder internals to the out-of-workspace
        # fuzz crate; nothing else in CI builds it, so guard against shim rot.
        # `--locked` so a drifted lockfile fails here instead of silently.
        run: cargo check -p tina-http --features fuzzing --locked

      - name: Verify workspace
        run: make verify

  fuzz:
    name: fuzz targets (60s each)
    # Weekly + manual only: gives the coverage-guided fuzzers SOME continuous
    # execution without gating every PR on them. This also compiles every
    # `fuzz/fuzz_targets/*.rs` (the per-PR shim check only compiles the library
    # feature, so a target itself can bit-rot silently otherwise).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # The pin in rust-toolchain.toml is already nightly, which cargo-fuzz
        # requires; rustup show syncs it.
        run: rustup show

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build all fuzz targets
        # Compile every target so a bit-rotted target fails the job even if its
        # short run finds nothing.
        working-directory: fuzz
        run: cargo fuzz build

      - name: Run each fuzz target for 60s
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in $(cargo fuzz list); do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" -- -max_total_time=60
            echo "::endgroup::"
          done

  # `make verify-examples` lives in the Makefile for local sweeps but
  # is intentionally not a per-PR gate: 35+ independent example crates ×
  # (test + clippy) with no shared cargo target = 20-40 minutes of runner
  # time, and most PRs don't touch examples. Those example workspaces are
  # also intentionally unlocked until each has an explicit lockfile policy.
  # Run it locally before a bridge change with downstream consumers, or
  # revisit promoting it to a scheduled job once we see how often examples
  # actually break.
