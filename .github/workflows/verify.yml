name: verify

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly fuzz run (see the `fuzz` job) and a manual trigger. Per-PR fuzzing
  # is too slow to gate on; the seed corpus is folded into deterministic unit
  # tests (`tina-http` `fuzz_corpus_regression` + `http2` lib tests) so every
  # PR still exercises the panic-containment property.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Compile-cache wiring shared by every build job below:
#   - Swatinem/rust-cache restores ~/.cargo (registry/git) + target/, keyed on
#     Cargo.lock + rustc version. Since the workspace builds --locked, the key
#     is exact: a cache hit means zero recompilation.
#   - sccache sits behind that as a second, finer-grained layer: it caches
#     individual compilation units (via the GitHub Actions cache backend), so
#     even a Cargo.lock bump or a new job/OS combination still gets warm
#     per-crate hits instead of a from-scratch rebuild. CARGO_INCREMENTAL=0 is
#     required alongside it -- sccache does not cache incremental artifacts,
#     so leaving incremental on on top of sccache just adds overhead for no
#     benefit. See the Makefile header for the local-dev equivalent.
#
# Caching keeps *compilation* warm (sccache hits ~76%), but linking the ~220
# test binaries is not cacheable and dominates the test job once warm. Two
# link-time levers attack that, configured outside this file:
#   - .cargo/config.toml points rustc at `mold` on Linux (installed per Linux
#     job via rui314/setup-mold); the fuzz workspace opts out.
#   - Cargo.toml's [profile.dev] uses line-tables-only debuginfo +
#     split-debuginfo=unpacked, cutting codegen/link weight on both OSes and
#     skipping macOS `dsymutil`.
env:
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Tier 4 split of the old single `verify` job: fmt/doc, clippy, the test
  # suite, and the loom/guard/cost checks now run as independent jobs so
  # wall-clock is the slowest group, not their sum.
  #
  # Platform coverage: fmt and doc are platform-independent, so `static` runs
  # ubuntu-only to save macOS minutes. clippy is NOT platform-independent --
  # it only lints code it compiles for the target, and this workspace has
  # macOS-only cfg blocks (fullfsync, signal handling) -- so the old
  # both-OS clippy coverage is preserved by matrixing the dedicated `clippy`
  # job over ubuntu + macos. test + guards also keep the full OS matrix since
  # both cover platform-specific runtime behavior.
  #
  # NOTE for branch protection: `main` currently has NO branch protection
  # rule configured (verified via `gh api repos/.../branches/main/protection`
  # -> 404 "Branch not protected"), so there is no existing required-check
  # name this rename could break. If branch protection is added later, the
  # per-PR gate is these job names (all matrixed ubuntu + macos):
  # "static checks (fmt, doc) (ubuntu-latest)" / "(macos-latest)",
  # "clippy (ubuntu-latest)" / "(macos-latest)",
  # "test (nextest + doctests) (ubuntu-latest)" / "(macos-latest)",
  # "guards (loom, race-surface, rail-inventory, cost) (ubuntu-latest)" / "(macos-latest)".
  static:
    name: static checks (fmt, doc) (${{ matrix.os }})
    # Both OSes: fmt is platform-independent, but `doc` is not — the workspace
    # has macOS-only `cfg` blocks (fullfsync/signal handling) whose rustdoc
    # `-D warnings` lints are only gated when doc runs on macOS too, matching
    # the old single `make verify` job.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zsh on Linux
        # Makefile SHELL is zsh (matches macOS's default); Linux runners need
        # it installed explicitly.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Set up mold linker (Linux)
        # `.cargo/config.toml` points rustc at mold for the Linux target to cut
        # test-binary link time; every Linux job that compiles needs it on PATH.
        # macOS is untouched (target-scoped flag). The weekly fuzz job opts out
        # via fuzz/.cargo/config.toml, so it needs no mold.
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Install pinned Rust toolchain
        # rustup show syncs the toolchain + components pinned in
        # rust-toolchain.toml, so the pin is the single source of truth.
        run: rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: fmt-check + doc
        run: make verify-static

  clippy:
    # Matrixed over both OSes on purpose: clippy only lints code compiled for
    # the active target, and macOS-only cfg blocks would otherwise never be
    # linted per-PR. Preserves the old single job's both-platform clippy.
    name: clippy (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Set up mold linker (Linux)
        # `.cargo/config.toml` points rustc at mold for the Linux target to cut
        # test-binary link time; every Linux job that compiles needs it on PATH.
        # macOS is untouched (target-scoped flag). The weekly fuzz job opts out
        # via fuzz/.cargo/config.toml, so it needs no mold.
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: clippy
        run: make clippy

  test:
    name: test (nextest + doctests) (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Set up mold linker (Linux)
        # `.cargo/config.toml` points rustc at mold for the Linux target to cut
        # test-binary link time; every Linux job that compiles needs it on PATH.
        # macOS is untouched (target-scoped flag). The weekly fuzz job opts out
        # via fuzz/.cargo/config.toml, so it needs no mold.
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Betelgeuse Linux backend smoke
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p tina-runtime --test betelgeuse_backend_ci
          cargo test --locked -p tina-runtime --test tcp_echo threaded_runtime_tcp_echo_round_trips_reference_workload

      - name: Bridge feature checks
        run: cargo check -p tina-sqlx-bridge --features tracing

      - name: Fuzz shim compiles
        # The `fuzzing` feature exposes decoder internals to the out-of-workspace
        # fuzz crate; nothing else in CI builds it, so guard against shim rot.
        # `--locked` so a drifted lockfile fails here instead of silently.
        run: cargo check -p tina-http --features fuzzing --locked

      - name: nextest + doctests
        # nextest does not run doctests; `make test` runs both so coverage
        # matches plain `cargo test --workspace`.
        run: make test

      - name: sccache stats
        # Ongoing signal: the sccache hit-rate right after the compile-heavy
        # `make test` step. A sudden drop here (e.g. a toolchain bump or a
        # rustflags change invalidating the cache) explains a slow run.
        if: always()
        run: sccache --show-stats || true

  guards:
    name: guards (loom, race-surface, rail-inventory, cost) (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Set up mold linker (Linux)
        # `.cargo/config.toml` points rustc at mold for the Linux target to cut
        # test-binary link time; every Linux job that compiles needs it on PATH.
        # macOS is untouched (target-scoped flag). The weekly fuzz job opts out
        # via fuzz/.cargo/config.toml, so it needs no mold.
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Install ripgrep
        # scripts/public_corpus_lexical_guard.sh (in `make verify-guards`)
        # scans the corpus with `rg`; the runner images do not ship it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          else
            brew install ripgrep
          fi

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: loom + race-surface-guard + rail-inventory-guard + cost
        run: make verify-guards

  fuzz:
    name: fuzz targets (60s each)
    # Weekly + manual only: gives the coverage-guided fuzzers SOME continuous
    # execution without gating every PR on them. This also compiles every
    # `fuzz/fuzz_targets/*.rs` (the per-PR shim check only compiles the library
    # feature, so a target itself can bit-rot silently otherwise).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Override the workflow-level sccache wrapper: this job has no
    # sccache-action step (cargo-fuzz's sanitizer-instrumented build isn't
    # worth wrapping), so inheriting RUSTC_WRAPPER=sccache would invoke a
    # binary that isn't installed and fail `cargo install cargo-fuzz`.
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # The pin in rust-toolchain.toml is already nightly, which cargo-fuzz
        # requires; rustup show syncs it.
        run: rustup show

      - name: Cache cargo + target
        # Same lock-keyed cache as the verify jobs; a weekly job benefits the
        # most from a warm registry/target since it otherwise always starts
        # cold. No sccache here: cargo-fuzz's sanitizer-instrumented build
        # uses non-standard rustc flags that aren't worth the extra moving
        # part on a job that already isn't a PR gate.
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build all fuzz targets
        # Compile every target so a bit-rotted target fails the job even if its
        # short run finds nothing.
        working-directory: fuzz
        run: cargo fuzz build

      - name: Run each fuzz target for 60s
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in $(cargo fuzz list); do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" -- -max_total_time=60
            echo "::endgroup::"
          done

  # `make verify-examples` lives in the Makefile for local sweeps but
  # is intentionally not a per-PR gate: 35+ independent example crates ×
  # (test + clippy) with no shared cargo target = 20-40 minutes of runner
  # time, and most PRs don't touch examples. Those example workspaces are
  # also intentionally unlocked until each has an explicit lockfile policy.
  # Run it locally before a bridge change with downstream consumers, or
  # revisit promoting it to a scheduled job once we see how often examples
  # actually break.

  # The local-I/O specimen and custom-codec extension are a small per-PR gate:
  # together they exercise the promoted UnixWriteAll user path and codec/IPC
  # examples changed by runtime rail work. They are excluded workspaces, so
  # the root `make test` job cannot cover them.
  promoted-io-examples:
    name: promoted I/O examples (Unix + codec)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo + target (per example workspace)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: |
            examples/specimen_local_io_codec_ipc -> target
            examples/extensions/tina-extension-custom-codec -> target

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Test and lint promoted I/O examples
        run: |
          cargo test --manifest-path examples/specimen_local_io_codec_ipc/Cargo.toml --tests
          cargo clippy --manifest-path examples/specimen_local_io_codec_ipc/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path examples/extensions/tina-extension-custom-codec/Cargo.toml --tests
          cargo clippy --manifest-path examples/extensions/tina-extension-custom-codec/Cargo.toml --all-targets -- -D warnings

  # Systems examples ARE a per-PR gate, unlike the sweep above:
  # - `system_copied_service_path` / `mini_saas_api`: the two examples the
  #   root README and docs point new users at first (copied-path skeleton /
  #   larger HTTP-fronted shape), so a change that breaks what a user would
  #   actually copy must fail CI, not just a local sweep nobody runs. Found
  #   by an external P0 review: `system_copied_service_path` used to build
  #   its report from constants without running an isolate, runtime, or
  #   shutdown at all, and its own smoke test failed
  #   (`assert_no_leaked_capacity_at_shutdown` panicked with `leak=unchecked`)
  #   — nothing in CI ever ran it, so the break shipped silently. Measured
  #   locally: `mini_saas_api`'s full non-ignored suite (smoke, budget,
  #   graceful_drain, scope_drain, soak, perf) finishes in ~4s once warm, so
  #   it rides along here instead of only in the opt-in `proof-soak` /
  #   `proof-long-soak` Makefile targets; `long_soak` stays `#[ignore]`d and
  #   PR-gate-exempt (`make proof-long-soak` remains the way to run it).
  # - `system_realtime_rooms`, `system_live_replay_bugbox`,
  #   `system_scoped_request_tree`: the three example suites `make
  #   proof-fast` promises as "the PR gate" (`.intent`/README docs point at
  #   proof-fast as the fast systems-level proof). Found unwired the same
  #   way #281 found the copied-path/mini_saas_api gap: `tina-proof-harness`
  #   is a workspace member so the `test` job already covers it, but these
  #   three are separate, excluded workspaces that no CI job ever ran.
  #   Riding along here instead of a new job keeps one place responsible for
  #   "example crates as PR gate".
  #
  # All five crates are separate, unlocked cargo workspaces (same convention
  # as the `verify-examples` sweep above), so this job caches them
  # individually via `rust-cache`'s multi-workspace `workspaces:` input
  # instead of relying on the root workspace's cache key.
  systems-examples:
    name: systems examples (copied-path + mini_saas_api + proof-fast trio) (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mold linker (Linux)
        uses: rui314/setup-mold@v1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo + target (per example workspace)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: |
            examples/systems/system_copied_service_path -> target
            examples/systems/mini_saas_api -> target
            examples/systems/system_realtime_rooms -> target
            examples/systems/system_live_replay_bugbox -> target
            examples/systems/system_scoped_request_tree -> target

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: system_copied_service_path (test + clippy)
        run: |
          cargo test --manifest-path examples/systems/system_copied_service_path/Cargo.toml --tests
          cargo clippy --manifest-path examples/systems/system_copied_service_path/Cargo.toml --all-targets -- -D warnings

      - name: mini_saas_api (test + clippy; long_soak stays opt-in via make proof-long-soak)
        run: |
          cargo test --manifest-path examples/systems/mini_saas_api/Cargo.toml --tests
          cargo clippy --manifest-path examples/systems/mini_saas_api/Cargo.toml --all-targets -- -D warnings

      - name: system_realtime_rooms (test + clippy; make proof-fast trio)
        run: |
          cargo test --manifest-path examples/systems/system_realtime_rooms/Cargo.toml --tests
          cargo clippy --manifest-path examples/systems/system_realtime_rooms/Cargo.toml --all-targets -- -D warnings

      - name: system_live_replay_bugbox (test + clippy; make proof-fast trio)
        run: |
          cargo test --manifest-path examples/systems/system_live_replay_bugbox/Cargo.toml --tests
          cargo clippy --manifest-path examples/systems/system_live_replay_bugbox/Cargo.toml --all-targets -- -D warnings

      - name: system_scoped_request_tree (test + clippy; make proof-fast trio)
        run: |
          cargo test --manifest-path examples/systems/system_scoped_request_tree/Cargo.toml --tests
          cargo clippy --manifest-path examples/systems/system_scoped_request_tree/Cargo.toml --all-targets -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # specimen_postgres_counter is the sole external-service public example
  # row: its public_smoke / public_characterization only count as proof when
  # they run against a real PostgreSQL — a green skip with DATABASE_URL
  # unset is not evidence. This job starts PostgreSQL 16, points
  # DATABASE_URL at it, and runs the exact public proof commands plus the
  # tokio control path (`-- both`). The specimen creates per-process unique
  # tables and drops them on exit, and the service container is fresh per
  # job, so no schema cleanup step is needed.
  postgres-example:
    name: postgres example (specimen_postgres_counter vs PostgreSQL 16)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo + target (per example workspace)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: |
            examples/specimen_postgres_counter -> target

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: specimen_postgres_counter public proof (tina + control)
        run: |
          cargo test --manifest-path examples/specimen_postgres_counter/Cargo.toml --test public_smoke public_smoke -- --exact
          cargo test --manifest-path examples/specimen_postgres_counter/Cargo.toml --test public_smoke public_characterization -- --exact
          cargo run --manifest-path examples/specimen_postgres_counter/Cargo.toml -- both
          cargo clippy --manifest-path examples/specimen_postgres_counter/Cargo.toml --all-targets -- -D warnings

  # Packaging-readiness smoke check (crates.io 0.1.0 prep): guards against
  # regressing back to an unpublishable crate graph. Two layers (see the
  # Makefile `verify-packaging` target):
  #  - `cargo package --no-verify` on the three crates that can package today
  #    (tina-macros, tina-rpc-macros, tina-codec -- no internal deps): proves
  #    each manifest packages and fails outright on a versionless `path`-only
  #    internal dep. Builds nothing (the `test`/`clippy` jobs cover that).
  #  - `packaging_metadata_guard.sh`: backstops what `cargo package` misses --
  #    a crate LOSING its description/license/repository (cargo only warns,
  #    exit 0), and a versionless path dep in a crate that can't package at
  #    all. Asserts both across every workspace crate.
  # Deliberately NOT part of the required-check critical path: `main` has no
  # branch protection today. Every workspace crate beyond the three above
  # either depends on the vendor-betelgeuse path dependency (no published
  # version to fall back to -- the open Betelgeuse question) or on another
  # workspace crate not yet live on crates.io, which is expected
  # pre-first-publish and cannot pass `cargo package` until the real, ordered
  # `cargo publish` sequence has run.
  packaging:
    name: packaging check (cargo package + metadata guard)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: cargo package --no-verify (publishable-today crates)
        run: make SHELL=/bin/bash verify-packaging
