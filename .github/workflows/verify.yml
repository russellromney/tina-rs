name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: make verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy

      - name: Betelgeuse Linux backend smoke
        if: runner.os == 'Linux'
        run: |
          cargo test -p tina-runtime --test betelgeuse_backend_ci
          cargo test -p tina-runtime --test tcp_echo threaded_runtime_tcp_echo_round_trips_reference_workload

      - name: Verify workspace
        run: make verify

  # `make verify-examples` lives in the Makefile for local sweeps but
  # is intentionally not a per-PR gate: 35 example crates × (test +
  # clippy) with no shared cargo target = 20-40 minutes of runner
  # time, and most PRs don't touch examples. Run it locally before a
  # bridge change with downstream consumers, or revisit promoting it
  # to a scheduled job once we see how often examples actually break.
