[package]
name = "tina-reqwest-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded outbound HTTP worker around reqwest, for Tina services"
repository = "https://github.com/russellromney/tina-rs"

[lib]
path = "src/lib.rs"

[dependencies]
tina = { path = "../tina" }
tina-runtime = { path = "../tina-runtime" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
http = { version = "1", default-features = false }
# Optional tracing scaffolding. No spans/events are emitted yet; the
# feature surface is here so we can align vocabulary across bridges
# in one pass instead of inventing per-crate field names.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
