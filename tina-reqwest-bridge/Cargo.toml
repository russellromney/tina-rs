[package]
name = "tina-reqwest-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded outbound HTTP worker around reqwest, for Tina services"
repository = "https://github.com/russellromney/tina-rs"
keywords = ["http-client", "reqwest", "outbound"]
categories = ["web-programming::http-client"]

[lib]
path = "src/lib.rs"

[dependencies]
tina = { path = "../tina", version = "0.1.0" }
tina-runtime = { path = "../tina-runtime", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
http = { version = "1", default-features = false }
# Optional tracing emission. Enables per-call events under
# `tina_reqwest.bridge.call` (`admission_rejected`, `admitted`,
# `replied`, `timeout`, `retry`) and lifecycle events under
# `tina_reqwest.bridge` (`close`). HTTP method rides on every
# per-call event. See `docs/tina-user-guide/19-tracing.md` for the
# field/level/reason vocabulary.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
