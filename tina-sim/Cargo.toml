[package]
name = "tina-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tina = { path = "../tina" }
tina-runtime = { path = "../tina-runtime" }
tina-supervisor = { path = "../tina-supervisor" }

[dev-dependencies]
tina-rpc = { path = "../tina-rpc" }
tokio = { version = "1.48.0", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "test-util"] }
