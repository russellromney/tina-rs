# Reviewed allowlist for intentional raw-runtime, shared-state, manual-drain,
# and low-level-vocabulary forms in the public corpus.
#
# Every entry names a path, ONE narrow guard rule it exempts, a behavior
# reason, the focused test that proves the exempted behavior, the reviewer,
# and the commit at which the exempted form was reviewed. Unknown fields,
# unknown rules, stale paths, and entries that no longer match a live guard
# hit fail the guards closed. Nothing may be added here without a recorded
# human decision and reviewer agreement.
schema = 1

