[package]
name = "specimen-postgres-counter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
] }
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-sqlx-bridge = { path = "../../tina-sqlx-bridge" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
