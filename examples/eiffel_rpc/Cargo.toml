[package]
name = "eiffel-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-rpc = { path = "../../tina-rpc" }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
