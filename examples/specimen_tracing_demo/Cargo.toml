[package]
name = "specimen-tracing-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-tracing = { path = "../../tina-tracing" }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
