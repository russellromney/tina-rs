[package]
name = "specimen-local-io-codec-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "specimen-local-io-codec-ipc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-sim = { path = "../../tina-sim" }
tina-codec = { path = "../../tina-codec" }
