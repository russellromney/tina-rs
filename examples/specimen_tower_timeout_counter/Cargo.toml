[package]
name = "specimen-tower-timeout-counter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-tokio-bridge = { path = "../../tina-tokio-bridge" }
tina-tower-bridge = { path = "../../tina-tower-bridge" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["timeout", "limit", "util"] }
