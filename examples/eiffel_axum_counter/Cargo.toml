[package]
name = "eiffel-axum-counter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-tokio-bridge = { path = "../../tina-tokio-bridge" }
tina-tower-bridge = { path = "../../tina-tower-bridge" }
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "sync"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tower-service = "0.3"

[workspace]
