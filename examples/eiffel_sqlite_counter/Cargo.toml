[package]
name = "eiffel-sqlite-counter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-sqlite-bridge = { path = "../../tina-sqlite-bridge" }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
