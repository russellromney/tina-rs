[package]
name = "specimen-ws-room"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
tina-tokio-bridge = { path = "../../tina-tokio-bridge" }
tina-tower-bridge = { path = "../../tina-tower-bridge" }
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "ws"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[workspace]
