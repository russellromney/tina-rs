[package]
name = "system-bounded-object-lane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
default = []
real-s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]

[dependencies]
anyhow = "1"
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
tina = { path = "../../../tina" }
tina-runtime = { path = "../../../tina-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
