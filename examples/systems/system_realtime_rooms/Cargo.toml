[workspace]

[package]
name = "system-realtime-rooms"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
http = { version = "1", default-features = false, features = ["std"] }
tina = { path = "../../../tina" }
tina-http = { path = "../../../tina-http" }
tina-runtime = { path = "../../../tina-runtime" }
# Used by the in-crate run scenarios as a real WebSocket smoke client.
tungstenite = "0.29"
