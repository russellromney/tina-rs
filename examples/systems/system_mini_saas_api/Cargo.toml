[package]
name = "system-mini-saas-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
http = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tina = { path = "../../../tina" }
tina-runtime = { path = "../../../tina-runtime" }
tina-sqlite-bridge = { path = "../../../tina-sqlite-bridge" }
tina-reqwest-bridge = { path = "../../../tina-reqwest-bridge" }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
