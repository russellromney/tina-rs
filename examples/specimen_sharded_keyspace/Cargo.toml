[package]
name = "specimen-sharded-keyspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Standalone — same pattern as the other specimen examples. The
# top-level workspace excludes them so each can be built and run
# independently with `cargo run -p specimen-sharded-keyspace --manifest-path
# examples/specimen_sharded_keyspace/Cargo.toml`.
[workspace]

[dependencies]
anyhow = "1"
tina = { path = "../../tina" }
tina-runtime = { path = "../../tina-runtime" }
