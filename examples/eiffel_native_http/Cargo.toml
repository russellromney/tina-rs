[package]
name = "eiffel-native-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = "0.7"
http = { version = "1", default-features = false, features = ["std"] }
tina = { path = "../../tina" }
tina-http = { path = "../../tina-http" }
tina-runtime = { path = "../../tina-runtime" }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
