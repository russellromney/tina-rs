[package]
name = "tina-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic single-shard runtime core for tina-rs"
repository = "https://github.com/russellromney/tina-rs"

[lib]
path = "src/lib.rs"

[dependencies]
# `runtime-internal` exposes the request-effect constructor the runtime needs;
# it is gated so it stays off `tina`'s default public surface. (Finding H4.)
tina = { path = "../tina", features = ["runtime-internal"] }
tina-macros = { path = "../tina-macros" }
tina-supervisor = { path = "../tina-supervisor" }
# Phase Mariner substrate target. Vendored from Pekka Enberg's Betelgeuse with
# a tiny local address-introspection patch (`local_addr` / `peer_addr`) so the
# TCP call family can report socket addresses honestly.
betelgeuse = { path = "../vendor-betelgeuse" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[target.'cfg(unix)'.dependencies]
# Phase Sadie's-Ward (043) live signal capture. Used only for installing
# flag-based handlers for SIGINT / SIGTERM. No async signal task, no
# Tokio dependency, no custom unsafe handler.
signal-hook = { version = "0.3", default-features = false }

[dev-dependencies]
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
rcgen = "0.13"
# Phase 100 safety-rails proof matrix: pin the diagnostic phrase emitted by
# `tina::CallableIsolate`'s `#[diagnostic::on_unimplemented]`. Plain
# `compile_fail` doctests pin compilation failure but not the message, so a
# regression that weakened the diagnostic to trait-soup would slip through.
trybuild = "1"
