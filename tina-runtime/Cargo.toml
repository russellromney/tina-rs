[package]
name = "tina-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic single-shard runtime core for tina-rs"
repository = "https://github.com/russellromney/tina-rs"
keywords = ["runtime", "deterministic", "actor"]
categories = ["asynchronous", "concurrency"]

[lib]
path = "src/lib.rs"

[features]
# Swaps `shared_scope`'s cap counters to loom atomics so
# `tests/loom_shared_scope.rs` can model the lock-free reserve/release CAS
# loops. Off by default; only the loom test build enables it.
loom = ["dep:loom"]

[dependencies]
tina = { path = "../tina", version = "0.1.0" }
tina-macros = { path = "../tina-macros", version = "0.1.0" }
tina-supervisor = { path = "../tina-supervisor", version = "0.1.0" }
# Runtime substrate target. Vendored from Pekka Enberg's Betelgeuse with
# a tiny local address-introspection patch (`local_addr` / `peer_addr`) so the
# TCP call family can report socket addresses honestly.
#
# Deliberately left WITHOUT a `version =`: this is a vendored, patched fork
# living at ../vendor-betelgeuse, not a published crate. It has no crates.io
# release to point a `version` requirement at (the name itself is currently
# unclaimed on crates.io), so packaging `tina-runtime` today strips the path
# and has nothing to fall back to. This is the open "Betelgeuse question"
# tracked in the packaging-readiness PR description -- until it's resolved
# (publish the fork under its own name, vendor the source directly into
# tina-runtime, or feature-gate it out), `tina-runtime` and everything that
# depends on it cannot pass `cargo package`.
betelgeuse = { path = "../vendor-betelgeuse" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# Only compiled under `--features loom` for the shared-capacity-scope model.
loom = { version = "0.7.2", optional = true }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
# Live signal capture. Used only for installing
# flag-based handlers for SIGINT / SIGTERM. No async signal task, no
# Tokio dependency, no custom unsafe handler.
signal-hook = { version = "0.3", default-features = false }
# Linux process driver: peek child exit with waitid(WNOWAIT) so the
# process-group leader pid stays reserved until descendant cleanup runs.
libc = "0.2"

[dev-dependencies]
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
rcgen = "0.13"
# Safety-rails proof matrix: pin the diagnostic phrase emitted by
# `tina::CallableIsolate`'s `#[diagnostic::on_unimplemented]`. Plain
# `compile_fail` doctests pin compilation failure but not the message, so a
# regression that weakened the diagnostic to trait-soup would slip through.
trybuild = "1"
